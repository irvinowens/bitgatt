plugins {
    id 'com.android.library' version '9.1.1'
    id 'maven-publish'
}

configurations {
    metalava
}

def packageName = 'com.fitbit.bluetooth.fbgatt'

def buildNumber = System.getenv("BUILD_NUMBER") != null ? System.getenv("BUILD_NUMBER").toInteger() : 10000
def libraryVersionName = sprintf("0.8.0", buildNumber)

android {
    namespace = 'com.fitbit.bluetooth.fbgatt'
    compileSdk = 37

    defaultConfig {
        minSdk = 21
        targetSdk = 37
        versionCode = buildNumber
        versionName = libraryVersionName
        multiDexEnabled = true
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    enableKotlin = true

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            enableUnitTestCoverage = true
            enableAndroidTestCoverage = true
        }
        library {
            debuggable = true
            minifyEnabled = false
            enableUnitTestCoverage = false
            enableAndroidTestCoverage = false
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

ext {
    MULTIDEX_VERSION = '2.0.1'
    APP_COMPAT_VERSION = '1.1.0'
    TIMBER_VERSION = '4.7.1'
    JUNIT_VERSION = '4.12'
    TEST_RUNNER_VERSION = '1.4.0'
    TEST_RULES_VERSION = '1.4.0'
    TEST_CORE_VERSION = '1.4.0'
    TEST_EXT_JUNIT_VERSION = '1.1.3'
    ESPRESSO_VERSION = '3.4.0'
    MOCKITO_VERSION = '2.19.1'
    BYTE_BUDDY_VERSION = '1.14.19'
    STETHO_VERSION = '1.5.1'
    COROUTINES_VERSION = '1.10.2'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.multidex:multidex:$MULTIDEX_VERSION"
    implementation "androidx.appcompat:appcompat:$APP_COMPAT_VERSION"
    implementation "androidx.core:core:1.15.0"
    implementation "com.jakewharton.timber:timber:$TIMBER_VERSION"
    implementation "com.facebook.stetho:stetho:$STETHO_VERSION"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$COROUTINES_VERSION"
    metalava 'com.android.tools.metalava:metalava:1.0.0-alpha16'
    testImplementation "junit:junit:$JUNIT_VERSION"
    testImplementation "androidx.test:core:$TEST_CORE_VERSION"
    testImplementation "androidx.test:runner:$TEST_RUNNER_VERSION"
    testImplementation "androidx.test:rules:$TEST_RULES_VERSION"
    testImplementation "androidx.test.ext:junit:$TEST_EXT_JUNIT_VERSION"
    testImplementation "org.mockito:mockito-inline:$MOCKITO_VERSION"
    testImplementation "org.mockito:mockito-core:$MOCKITO_VERSION"
    testImplementation "net.bytebuddy:byte-buddy:$BYTE_BUDDY_VERSION"
    testImplementation "net.bytebuddy:byte-buddy-agent:$BYTE_BUDDY_VERSION"
    androidTestImplementation "androidx.test.espresso:espresso-core:$ESPRESSO_VERSION"
    androidTestImplementation "junit:junit:$JUNIT_VERSION"
    androidTestImplementation "androidx.test:core:$TEST_CORE_VERSION"
    androidTestImplementation "androidx.test:runner:$TEST_RUNNER_VERSION"
    androidTestImplementation "androidx.test:rules:$TEST_RULES_VERSION"
    androidTestImplementation "androidx.test.ext:junit:$TEST_EXT_JUNIT_VERSION"
    androidTestImplementation "org.mockito:mockito-inline:$MOCKITO_VERSION"
    androidTestImplementation "org.mockito:mockito-core:$MOCKITO_VERSION"
    androidTestImplementation("org.mockito:mockito-android:$MOCKITO_VERSION") {
        exclude group: "net.bytebuddy"
    }
    androidTestImplementation "net.bytebuddy:byte-buddy:$BYTE_BUDDY_VERSION"
    androidTestImplementation "net.bytebuddy:byte-buddy-agent:$BYTE_BUDDY_VERSION"
}

def publicApiFile = layout.projectDirectory.file('api/public-api.txt')

def metalavaClasspath = {
    tasks.named('compileDebugJavaWithJavac', JavaCompile).get().classpath.files.findAll { file ->
        file.isDirectory() || file.name.endsWith('.jar')
    }.collect { it.absolutePath }.join(File.pathSeparator)
}

def metalavaJavaSourceArg = {
    // ConnectionEngine.kt uses @Throws(InterruptedException::class). Metalava 1.0.0-alpha16
    // aborts on that class-literal annotation (PsiType ErrorType). Every other source is included
    // so suspend GattConnection.runTx is part of the checked signature.
    fileTree(file('src/main/java')) {
        include '**/*.java'
        include '**/*.kt'
        exclude '**/ConnectionEngine.kt'
    }.files.collect { it.absolutePath }.join(',')
}

tasks.register('updatePublicApi', JavaExec) {
    group = 'verification'
    description = 'Write the current public API signature to api/public-api.txt'
    dependsOn 'compileDebugJavaWithJavac'
    classpath = configurations.metalava
    mainClass = 'com.android.tools.metalava.Driver'
    def output = publicApiFile.asFile
    inputs.dir 'src/main/java'
    outputs.file output
    doFirst {
        output.parentFile.mkdirs()
        args 'main',
            '--source-files', metalavaJavaSourceArg(),
            '--classpath', metalavaClasspath(),
            '--format', '2.0:strip-java-lang-prefix=never',
            '--api', output.absolutePath,
            '--hide', 'HiddenSuperclass',
            '--hide', 'UnresolvedImport',
            '--hide', 'ReferencesHidden',
            '--hide', 'HiddenTypeParameter',
            '--hide', 'DeprecationMismatch'
    }
}

def publicApiSnapshot = layout.buildDirectory.file('metalava/public-api.txt')

tasks.register('snapshotPublicApi', JavaExec) {
    description = 'Write the current public API signature to the build directory'
    dependsOn 'compileDebugJavaWithJavac'
    classpath = configurations.metalava
    mainClass = 'com.android.tools.metalava.Driver'
    def output = publicApiSnapshot.get().asFile
    inputs.dir 'src/main/java'
    outputs.file output
    doFirst {
        output.parentFile.mkdirs()
        args 'main',
            '--source-files', metalavaJavaSourceArg(),
            '--classpath', metalavaClasspath(),
            '--format', '2.0:strip-java-lang-prefix=never',
            '--api', output.absolutePath,
            '--hide', 'HiddenSuperclass',
            '--hide', 'UnresolvedImport',
            '--hide', 'ReferencesHidden',
            '--hide', 'HiddenTypeParameter',
            '--hide', 'DeprecationMismatch'
    }
}

tasks.register('checkPublicApi') {
    group = 'verification'
    description = 'Fail if the public API differs from api/public-api.txt'
    dependsOn 'snapshotPublicApi'
    def expected = publicApiFile
    def actual = publicApiSnapshot
    inputs.file expected
    doLast {
        def expectedText = expected.asFile.getText('UTF-8')
        def actualText = actual.get().asFile.getText('UTF-8')
        if (expectedText != actualText) {
            throw new GradleException('Public API differs from api/public-api.txt. Review the change and run updatePublicApi.')
        }
    }
}

tasks.named('check').configure {
    dependsOn 'checkPublicApi'
}

tasks.register('sourceJar', Jar) {
    from android.sourceSets.main.java.srcDirs
    archiveClassifier.set('sources')
}

publishing {
    publications {
        libraryAar(MavenPublication) {
            groupId = packageName
            version = libraryVersionName
            artifactId = project.name
            artifact(sourceJar) {
                classifier = 'library'
            }
            artifact("$buildDir/outputs/aar/${project.name}-library.aar") {
                classifier = 'library'
            }
        }
        releaseAar(MavenPublication) {
            groupId = packageName
            version = libraryVersionName
            artifactId = project.name
            artifact("$buildDir/outputs/aar/${project.name}-release.aar") {
                classifier = 'release'
            }
            artifact(sourceJar) {
                classifier = 'release'
            }
        }
        debugAar(MavenPublication) {
            groupId = packageName
            version = libraryVersionName
            artifactId = project.name
            artifact("$buildDir/outputs/aar/${project.name}-debug.aar") {
                classifier = 'debug'
            }
            artifact(sourceJar) {
                classifier = 'debug'
            }
        }
        testAar(MavenPublication) {
            groupId = packageName
            version = libraryVersionName
            artifactId = project.name
            artifact("$buildDir/outputs/aar/${project.name}-batteryDataTest.aar") {
                classifier = 'test'
            }
            artifact(sourceJar) {
                classifier = 'test'
            }
        }
    }
}
