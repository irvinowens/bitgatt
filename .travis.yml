language: java
jdk: openjdk17
dist: jammy

before_cache:
  - rm -f  $HOME/.gradle/caches/modules-2/modules-2.lock
  - rm -fr $HOME/.gradle/caches/*/plugin-resolution/

cache:
  directories:
    - $HOME/android-sdk-dl
    - $HOME/android-sdk
    - $HOME/.gradle/caches/
    - $HOME/.gradle/wrapper/
    - $HOME/.android/build-cache

install:
  - mkdir -p $HOME/android-sdk-dl
  - if test ! -e $HOME/android-sdk-dl/commandlinetools.zip; then curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip > $HOME/android-sdk-dl/commandlinetools.zip; fi
  - mkdir -p $HOME/android-sdk/cmdline-tools
  - unzip -qq -n $HOME/android-sdk-dl/commandlinetools.zip -d $HOME/android-sdk/cmdline-tools
  - if test ! -d $HOME/android-sdk/cmdline-tools/latest; then mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest; fi
  - yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk 'platform-tools' > /dev/null
  - yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk 'build-tools;36.0.0' > /dev/null
  - yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk 'platforms;android-37.0' > /dev/null

env:
  - ANDROID_HOME=$HOME/android-sdk

script: TERM=dumb ./gradlew assembleDebug testDebug
